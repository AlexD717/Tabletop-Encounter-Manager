name: GO Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up GO
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'

    - name: Run Unit Tests
      run: go test